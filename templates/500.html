{% extends "base.html" %}

{% block title %}Internal Server Error - CrediGuard{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card shadow-sm p-5">
            <i class="fa-solid fa-triangle-exclamation fs-1 text-danger mb-3"></i>
            <h1 class="display-4 fw-bold text-dark mb-2">500</h1>
            <h4 class="fw-semibold text-secondary mb-3">Internal Server Error</h4>
            <p class="text-muted mb-4">
                An unexpected server error occurred while processing your request. Please try again or return to the main dashboard.
            </p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 shadow-sm">
                    <i class="fa-solid fa-house me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
